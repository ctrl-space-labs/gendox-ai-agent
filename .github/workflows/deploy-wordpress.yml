name: Deploy to WordPress.org

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to deploy."
        required: true
        type: string

jobs:
  deploy:
    name: Deploy plugin
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi

          # Only release tags: vMAJOR.MINOR.PATCH (digits only). Skip alphas/betas/RCs.
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping SVN deploy: '$REF' is not vMAJOR.MINOR.PATCH (e.g. v1.0.5)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${REF#v}"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.meta.outputs.deploy == 'true'
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: WordPress Plugin Deploy
        if: steps.meta.outputs.deploy == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          SLUG: gendox-ai-agent
          VERSION: ${{ steps.meta.outputs.version }}
